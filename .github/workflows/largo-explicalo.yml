# (10-nov-2026) Largos del YouTube de Explícalo. Los fabrica (desde el 14-nov-2026) «Canales» en GitHub de madrugada, 20 al mes, y deja
# una nota en /redes/expl-largo-hoy. Este workflow la recoge por la mañana y la publica YA con la cuenta de Metricool de
# Explícalo (Buffer solo sube Shorts a YouTube y rechazaba los largos). Si hoy no hay largo, no hace nada.
name: Largo de Explícalo

on:
  schedule:
    - cron: "17 6 * * *"    # 7:17 / 8:17 en Madrid: el servidor empieza a las 1:12 y tarda una o dos horas
  workflow_dispatch:
    inputs:
      mover:
        description: "id de un post de Metricool ya programado: cambiarle la hora (fecha)"
        default: ""
      fecha:
        description: "con mover: AAAA-MM-DDTHH:MM (hora de Madrid) o ahora"
        default: "ahora"
      miniatura:
        description: "con mover: 1 = hacerle además la miniatura buena (la del largo de hoy del servidor)"
        default: ""

concurrency:
  group: largo-explicalo
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Cambiar la hora de un largo ya programado
        if: inputs.mover != ''
        env:
          REFRESH: ${{ secrets.METRICOOL_EXPLICALO_REFRESH }}
          GH_SECRETOS: ${{ secrets.GH_SECRETOS }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mini=""
          curl -sf -o /tmp/pub.json https://raw.githubusercontent.com/${{ github.repository }}/explicalo-largo/expl-largo-hoy.json || true
          if [ "${{ inputs.miniatura }}" = 1 ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; pip install -q pillow numpy
            python3 metricool/miniatura_explicalo.py /tmp/pub.json /tmp/mini
            tag="expl-largo-$(TZ=Europe/Madrid date +%Y%m%d-%H%M)"
            gh release create "$tag" /tmp/mini/miniatura_A.jpg -R ${{ github.repository }} -t "$tag" -n "Miniatura largo Explícalo"
            mini="https://github.com/${{ github.repository }}/releases/download/$tag/miniatura_A.jpg"
          fi
          python3 -c "import json,sys;json.dump({'mover':sys.argv[1],'fecha':sys.argv[2],'miniatura':sys.argv[3],'titulo_buscar':sys.argv[4]},open('/tmp/mover.json','w'))" "${{ inputs.mover }}" "${{ inputs.fecha }}" "$mini" "$(python3 -c "import json;print(json.load(open('/tmp/pub.json'))['titulo'])" 2>/dev/null)"
          python3 metricool/publicar_largo.py explicalo /tmp/mover.json
      - name: Leer el largo de hoy del servidor
        if: inputs.mover == ''
        id: leer
        run: |
          code=$(curl -s -o /tmp/publicacion.json -w '%{http_code}' https://raw.githubusercontent.com/${{ github.repository }}/explicalo-largo/expl-largo-hoy.json)
          if [ "$code" != 200 ]; then echo "Hoy no hay largo de Explícalo ($code)"; echo "hay=no" >> $GITHUB_OUTPUT; exit 0; fi
          hoy=$(TZ=Europe/Madrid date +%Y-%m-%d)
          # (14-nov-2026) la nota la deja ahora GitHub (canales.yml) en la rama explicalo-largo: solo vale si es de hoy
          d=$(python3 -c "import json;print(json.load(open('/tmp/publicacion.json')).get('dia',''))")
          if [ "$d" != "$hoy" ]; then echo "La nota del largo no es de hoy ($d)"; echo "hay=no" >> $GITHUB_OUTPUT; exit 0; fi
          if git fetch -q --depth 1 origin datos && git show origin/datos:largos_explicalo.txt 2>/dev/null | grep -q "^$hoy"; then
            echo "El largo de hoy ya está publicado"; echo "hay=no" >> $GITHUB_OUTPUT; exit 0; fi
          u=$(python3 -c "import json;print(json.load(open('/tmp/publicacion.json'))['video'])")
          c=$(curl -s -o /dev/null -I -w '%{http_code}' "$u"); echo "$u → $c"; [ "$c" = 200 ] || { echo "falta el vídeo"; exit 1; }
          python3 -c "import json;p=json.load(open('/tmp/publicacion.json'));print('Largo:',p['titulo'])"
          echo "hay=si" >> $GITHUB_OUTPUT
      - name: Miniatura pensada para el clic (cada vídeo; si falla, se queda el fotograma del servidor)
        if: steps.leer.outputs.hay == 'si'
        continue-on-error: true
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; pip install -q pillow numpy
            python3 metricool/miniatura_explicalo.py /tmp/publicacion.json /tmp/mini
            tag="expl-largo-$(TZ=Europe/Madrid date +%Y%m%d-%H%M)"
            gh release create "$tag" /tmp/mini/miniatura_A.jpg -R ${{ github.repository }} -t "$tag" -n "Miniatura largo Explícalo"
            mini="https://github.com/${{ github.repository }}/releases/download/$tag/miniatura_A.jpg"
            python3 -c "import json,sys;p=json.load(open('/tmp/publicacion.json'));p['miniatura']=sys.argv[1];json.dump(p,open('/tmp/publicacion.json','w'),ensure_ascii=False)" "$mini"
      - name: Publicar con Metricool
        if: steps.leer.outputs.hay == 'si'
        env:
          REFRESH: ${{ secrets.METRICOOL_EXPLICALO_REFRESH }}
          GH_SECRETOS: ${{ secrets.GH_SECRETOS }}
        run: python3 metricool/publicar_largo.py explicalo /tmp/publicacion.json | tee /tmp/salida.txt
      - name: Apuntarlo (para no publicarlo dos veces)
        if: steps.leer.outputs.hay == 'si'
        run: |
          grep -q PROGRAMADO /tmp/salida.txt || exit 0
          d=$(mktemp -d); git clone -q --depth 1 --branch datos "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "$d"
          echo "$(TZ=Europe/Madrid date '+%Y-%m-%d %H:%M')|$(python3 -c "import json;print(json.load(open('/tmp/publicacion.json'))['titulo'].replace('|','-'))")" >> "$d/largos_explicalo.txt"
          cd "$d" && git -c user.name="Explícalo" -c user.email="sinhumotv@users.noreply.github.com" commit -qam "largo de Explícalo" 2>/dev/null || { git add largos_explicalo.txt && git -c user.name="Explícalo" -c user.email="sinhumotv@users.noreply.github.com" commit -qm "largo de Explícalo"; }
          git push -q
