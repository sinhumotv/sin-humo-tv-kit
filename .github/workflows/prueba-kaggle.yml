# (12-nov-2026) Pongamos Que: prueba de un clip IA en la GPU gratis de Kaggle + acceso al motor privado de Explícalo.
name: Prueba Kaggle
on:
  push:
    branches: [claude/kind-brown-9clxsm]
    paths: ['.github/workflows/prueba-kaggle.yml', 'pongamosque/kaggle/**']
  workflow_dispatch:
jobs:
  motor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        continue-on-error: true
        with: { repository: sinhumotv/Explicalo, token: '${{ secrets.GH_SECRETOS }}', path: explicalo, sparse-checkout: plataforma/v2 }
      - run: |
          ls explicalo/plataforma/v2 2>/dev/null | head -5 && echo "MOTOR PRIVADO - ACCESO OK" || echo "MOTOR PRIVADO - SIN ACCESO"
  clip:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q "kaggle>=1.8"
      - env: { KAGGLE_API_TOKEN: '${{ secrets.KAGGLE_API_TOKEN }}' }
        run: |
          export KAGGLE_API_TOKEN="$(printf %s "$KAGGLE_API_TOKEN" | tr -d '[:space:]')"
          python3 -c "import json;p='Dynamic cinematic motion: {}, the camera moves through the scene. {} Realistic natural movement, highly detailed.';json.dump([{'n':5,'jpg':'pongamosque/kaggle/prueba.jpg','semilla':1,'prompt':p.format('heavy rain pours down, giant waves crash against the cliff','A lighthouse on a cliff in a violent storm at sunset.')},{'n':6,'jpg':'pongamosque/kaggle/prueba.jpg','semilla':2,'prompt':p.format('lightning flashes, wind bends the grass','A lighthouse on a cliff in a violent storm.')}],open('ped.json','w'))" 
          python3 pongamosque/kaggle/lanzar.py salida ped.json
          ls -la salida
          mkdir -p pongamosque/kaggle/prueba_salida && cp salida/*_ia.mp4 pongamosque/kaggle/prueba_salida/ || true
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add -f pongamosque/kaggle/prueba_salida && git commit -qm "Clips de prueba de Kaggle (temporal)" && git pull -q --rebase && git push || true
