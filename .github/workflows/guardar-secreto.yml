# Guarda un secreto de GitHub sin que su valor pase nunca en claro por el repositorio ni por los registros:
# el runner crea una pareja de claves de un solo uso, publica la pública en el registro, espera el valor cifrado
# (rama secreto-tmp, archivo cifrado.b64), lo descifra en memoria, lo guarda como secreto y borra la rama.
name: Guardar secreto

on:
  workflow_dispatch:
    inputs:
      nombre:
        description: "Nombre del secreto (p. ej. GEMINI_KEY_RESERVA)"
        required: true

permissions:
  contents: write

jobs:
  guardar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: pip install -q pynacl
      - name: Esperar el valor cifrado y guardarlo
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETOS }}
          NOMBRE: ${{ inputs.nombre }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess, time, urllib.request
          from nacl.public import PrivateKey, SealedBox
          k = PrivateKey.generate()
          print("CLAVE_PUBLICA", base64.b64encode(bytes(k.public_key)).decode(), flush=True)
          url = "https://raw.githubusercontent.com/sinhumotv/sin-humo-tv-kit/secreto-tmp/cifrado.b64"
          for _ in range(100):
              time.sleep(10)
              try:
                  b = urllib.request.urlopen(url + f"?t={time.time()}", timeout=20).read()
                  valor = SealedBox(k).decrypt(base64.b64decode(b.strip())).decode()
              except Exception:
                  continue
              r = subprocess.run(["gh", "secret", "set", os.environ["NOMBRE"], "-R", "sinhumotv/sin-humo-tv-kit"],
                                 input=valor, text=True, capture_output=True)
              print("GUARDADO" if r.returncode == 0 else "FALLO " + r.stderr[-300:], os.environ["NOMBRE"])
              break
          else:
              print("FALLO: no llegó el valor cifrado")
          PY
      - name: Borrar la rama temporal
        if: always()
        run: git push -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/sinhumotv/sin-humo-tv-kit" --delete secreto-tmp || true
