# Compara motores de voz gratis y de código abierto (Qwen3-TTS, de Alibaba) con la voz de sin humo TV.
name: Prueba voces alternativas

on:
  workflow_dispatch:

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        motor: [qwen_clon, qwen_diseno]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Programas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -q -U qwen-tts soundfile
      - name: Generar
        run: python3 voz_chatterbox/alternativas.py ${{ matrix.motor }} salida
      - name: MP3
        run: for f in salida/*.wav; do ffmpeg -loglevel error -y -i "$f" -af loudnorm=I=-16 -b:a 160k "${f%.wav}.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: voz-${{ matrix.motor }}
          path: salida/*.mp3
