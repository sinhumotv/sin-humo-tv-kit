# Crea voces propias con Qwen3-TTS VoiceDesign (solo descripción, sin audio de terceros), un grupo por trabajo.
name: Diseñar voz Qwen

on:
  workflow_dispatch:
    inputs:
      grupos:
        description: 'Grupos de voz_chatterbox/voces_disenos.json, p. ej. ["relatos","cajanegra"]'
        default: '["relatos","cajanegra","ano2100","explicalo"]'

jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        grupo: ${{ fromJSON(inputs.grupos) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Programas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q --index-url https://download.pytorch.org/whl/cpu torch torchaudio
          pip install -q -U qwen-tts soundfile
      - name: Crear voces
        run: |
          python3 voz_chatterbox/disenar_voz.py ${{ matrix.grupo }} salida
          for f in salida/*.wav; do ffmpeg -loglevel error -y -i "$f" -af loudnorm=I=-16 -b:a 160k "${f%.wav}.mp3"; done
      - uses: actions/upload-artifact@v4
        with:
          name: voces-${{ matrix.grupo }}
          path: salida/
