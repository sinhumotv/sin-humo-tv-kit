# Tanda diaria de vídeos SIN Claude: guiones con Gemini, imágenes con Cloudflare (o vídeo real de Pixabay), voz Gemini, publicación con Buffer.
# Claves en Settings → Secrets and variables → Actions (nunca en el código).
name: Tanda diaria de vídeos

on:
  schedule:
    - cron: "17 4 * * *"   # 04:17 UTC = 05:17 (invierno) / 06:17 (verano) en Madrid
    - cron: "17 9 * * *"   # repesca: rehace solo los vídeos que hayan fallado (horas aún por llegar)
  workflow_dispatch:
    inputs:
      canal:
        description: "Canal (relatos, cajanegra, ano2100)"
        default: "relatos"
      n:
        description: "Número de vídeos (vacío = todos los del día)"
        default: ""
      probar:
        description: "1 = solo fabricar (sin publicar) y dejar el vídeo para revisarlo"
        default: ""
      modo:
        description: "con probar: real (vídeo de Pixabay) o ia"
        default: "real"
      extra:
        description: "1 = un vídeo EXTRA con vídeo real, publicado en cuanto esté"
        default: ""

permissions:
  contents: write

jobs:
  tanda:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        canal: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.canal)) || fromJSON('["relatos","ano2100","cajanegra"]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Programas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q numpy pillow faster-whisper
      - name: Hacer y programar los vídeos
        env:
          GEMINI_KEY: ${{ secrets[format('{0}_GEMINI_KEY', matrix.canal)] || secrets.GEMINI_KEY }}
          GEMINI_KEY_RESERVA: ${{ secrets.GEMINI_KEY_RESERVA }}
          CF_ACCOUNT: ${{ secrets[format('{0}_CF_ACCOUNT', matrix.canal)] }}
          CF_TOKEN: ${{ secrets[format('{0}_CF_TOKEN', matrix.canal)] }}
          BUFFER_KEY: ${{ secrets[format('{0}_BUFFER_KEY', matrix.canal)] }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          N: ${{ inputs.n }}
          REPESCA: ${{ github.event.schedule == '17 9 * * *' && '1' || '' }}
          PROBAR: ${{ inputs.probar }}
          MODO_PRUEBA: ${{ inputs.modo }}
          EXTRA: ${{ inputs.extra }}
          WHISPER_MODELO: base
        run: |
          [ -z "$N" ] && unset N
          [ -z "$PROBAR" ] && unset PROBAR
          [ -z "$EXTRA" ] && unset EXTRA
          python3 relatos/diario.py ${{ matrix.canal }}
      - name: Vídeo de prueba
        if: ${{ inputs.probar == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: prueba-${{ matrix.canal }}
          path: prueba/
